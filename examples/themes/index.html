<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Spin Wheel Example - Themes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="icon" href="data:image/x-icon;," type="image/x-icon">
  <link rel="stylesheet" href="./css/index.css"/>
  <script src="./js/index.js" type="module"></script>
</head>

<body>
  <div class="gui-wrapper">
    <p>Click-drag (or touch-flick) to spin the wheel.</p>
    <div>
      <button id="spinnerButton">Spin</button>
      <button id="clearLeaves">Clear</button>
      <button id="addLeaves">Add</button>
      <p><label>Theme:</label><select></select></p>
    </div>
  </div>

  <div id="popup" class="hidden">
    <div class="modal">
      <tr> <td>Clear Items  </td><td><input type="checkbox" id="clearCheck"></td></tr>
      <h2>Add Item</h2>
      <div id="addLeavesQueue"></div>
      <input id="leafEntry">
      <button id="addLeaf">Add</button>
      <button id="submitLeaves">Done</button>

    </div>
  </div>

  <div class="wheel-wrapper"></div>
</body>

</html>
